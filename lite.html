<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141110">
<title>Cancionero lite</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#141110;color:#f3e8d6;font-family:Arial,Helvetica,sans-serif;}
button,select,input{font-family:inherit;font-size:1rem;}
#home{padding:14px 14px 40px;max-width:820px;margin:0 auto;}
h1{font-family:Georgia,serif;font-size:1.5rem;margin:4px 0 2px;}
h2{font-size:1rem;color:#d9a55b;margin:22px 0 8px;text-transform:uppercase;letter-spacing:1px;}
.sub{color:#a3916f;font-size:0.85rem;margin-bottom:10px;}
.btn{background:#3d2f1f;color:#f3e8d6;border:1px solid #5a4630;border-radius:8px;padding:10px 14px;cursor:pointer;}
.btn:active{background:#5a4630;}
.btn-main{background:#b5762c;border-color:#b5762c;color:#141110;font-weight:bold;font-size:1.1rem;width:100%;padding:14px;margin-top:10px;}
.btn-small{padding:6px 10px;font-size:0.85rem;}
.btn[disabled]{opacity:0.3;}
#status{font-size:0.85rem;color:#a3916f;margin-top:6px;}
.row{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;border-bottom:1px solid #2c241b;padding:9px 2px;}
.row .grow{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-width:0;}
.row .t{font-size:1rem;}
.row .k{color:#d9a55b;font-size:0.8rem;}
.row .btn{margin-left:6px;}
#search{width:100%;padding:11px;border-radius:8px;border:1px solid #5a4630;background:#1f1a14;color:#f3e8d6;}
#songs{max-height:45vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:6px;border:1px solid #2c241b;border-radius:8px;padding:0 8px;}
.added{color:#7fbf7f;}
select.keysel{background:#1f1a14;color:#f3e8d6;border:1px solid #5a4630;border-radius:6px;padding:5px;}
.empty{color:#a3916f;font-size:0.9rem;padding:8px 2px;}

/* modo en vivo */
#live{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:#141110;z-index:10;}
#live.open{display:block;}
#liveTop{position:absolute;left:0;right:0;top:0;height:46px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:0 8px;background:#0e0c0a;z-index:3;}
#liveCounter{-webkit-box-flex:1;-webkit-flex:1;flex:1;text-align:center;color:#e8dcc4;font-size:0.9rem;}
#liveSlide{position:absolute;left:0;right:0;top:46px;bottom:62px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px 30px;}
.ptitle{font-family:Georgia,serif;font-weight:bold;text-align:center;font-size:1.7em;margin-bottom:2px;}
.pkey{color:#d9a55b;text-align:center;font-size:0.85em;margin-bottom:18px;}
.psec{font-size:1.5em;line-height:1.8;margin:12px auto;max-width:760px;}
.plabel{color:#a3916f;font-style:italic;margin-right:8px;font-size:0.65em;}
.pchords{font-family:'Courier New',monospace;font-weight:bold;color:#e0a552;}
.plyric{display:block;color:#b3a488;font-size:0.6em;margin-top:2px;}
#liveBottom{position:absolute;left:0;right:0;bottom:0;height:62px;background:#0e0c0a;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:0 6px;padding-bottom:env(safe-area-inset-bottom,0px);z-index:3;}
.lb{background:#2c241b;color:#f3e8d6;border:1px solid #3d2f1f;border-radius:8px;min-width:44px;height:44px;margin:0 2px;font-weight:bold;}
.lb:active{background:#5a4630;}
.navbig{min-width:60px;font-size:1.4rem;}
#gradosBtn{padding:0 12px;}
#gradosBtn.on{background:#6b431d;}
#gradosPanel{display:none;position:absolute;left:0;right:0;bottom:62px;background:#1f1a14;border-top:1px solid #3d2f1f;padding:8px 8px 4px;z-index:4;}
#gradosPanel.open{display:block;}
#gradosRoot{width:100%;padding:6px;border-radius:6px;border:1px solid #5a4630;background:#141110;color:#f1e3d1;margin-bottom:6px;}
#gradosRow{overflow:hidden;}
.grado{float:left;width:14.2857%;padding:0 3px 6px;}
.grado button{width:100%;background:#2b241c;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#f1e3d1;padding:9px 0;}
.grado button.playing{background:#6b431d;}
.grado .gn{display:block;color:#e0a552;font-weight:bold;font-size:0.95rem;}
.grado .gc{display:block;font-size:1.2rem;margin-top:2px;}
@media (max-width:600px){ .grado{width:25%;} .grado button{padding:11px 0;} }
#liveBottom span{white-space:nowrap;}
@media (max-width:480px){
  .lb{min-width:34px;height:40px;margin:0 1px;padding:0 4px;}
  .navbig{min-width:42px;}
  #liveKey{height:40px;width:62px;}
}
#liveKey{background:#1f1a14;color:#f3e8d6;border:1px solid #5a4630;border-radius:6px;height:44px;}
</style>
</head>
<body>

<div id="home">
  <h1>Cancionero lite</h1>
  <div class="sub">Versión liviana para tablets viejas: solo modo en vivo.</div>
  <button class="btn" id="refreshBtn">&#8635; Actualizar canciones</button>
  <div id="status"></div>

  <h2>Listas guardadas</h2>
  <div id="lists"></div>

  <h2>Armar en el momento</h2>
  <input id="search" type="text" placeholder="Buscar canción...">
  <div id="songs"></div>

  <h2>Para tocar (<span id="queueCount">0</span>)</h2>
  <div id="queue"></div>
  <button class="btn btn-main" id="goLive">&#127908; Modo en vivo</button>
</div>

<div id="live">
  <div id="liveTop">
    <button class="lb" id="liveClose">&#10005;</button>
    <div id="liveCounter"></div>
    <button class="lb" id="gradosBtn">&#127932; Grados</button>
  </div>
  <div id="liveSlide"></div>
  <div id="gradosPanel">
    <select id="gradosRoot"></select>
    <div id="gradosRow"></div>
  </div>
  <div id="liveBottom">
    <button class="lb navbig" id="prevBtn">&#8249;</button>
    <span>
      <button class="lb" id="zoomOut">A&minus;</button><button class="lb" id="zoomIn">A+</button>
    </span>
    <span>
      <button class="lb" id="keyDown">&minus;</button><select id="liveKey"></select><button class="lb" id="keyUp">+</button><button class="lb" id="keyReset">&#8634;</button>
    </span>
    <button class="lb navbig" id="nextBtn">&#8250;</button>
  </div>
</div>

}
function allowSleep(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
  if(noSleepVideo){ try{ noSleepVideo.pause(); }catch(e){} }
}
/* al volver a la app (por ejemplo tras bloquear la pantalla) se reactiva si seguís en el vivo */
document.addEventListener('visibilitychange', function(){ if(!document.hidden && isLive()) keepAwake(); }, false);

function openLive(i){
  if(!queue.length){ alert('Agregá al menos una canción primero.'); return; }
  cur = Math.max(0, Math.min(queue.length-1, i || 0));
  $('live').className = 'open';
  renderSlide();
  keepAwake();
}
function closeLive(){
  $('live').className = '';
  allowSleep();
  var ex = document.exitFullscreen || document.webkitExitFullscreen;
  if(ex && (document.fullscreenElement || document.webkitFullscreenElement)){ try{ ex.call(document); }catch(e){} }
  renderQueue();
}
function isLive(){ return $('live').className === 'open'; }
function go(d){ var n = cur + d; if(n < 0 || n >= queue.length) return; cur = n; renderSlide(); }
function shiftKey(d){
  var item = queue[cur]; item.key = KEYS[mod12(keyIndex(item.key) + d)];
  saveQueue(); renderSlide();
}
function resetKey(){ var s = findSong(queue[cur].id); queue[cur].key = s.versions[0].key; saveQueue(); renderSlide(); }
function setZoom(z){ zoom = Math.max(0.6, Math.min(2.5, Math.round(z*10)/10)); lsSet(ZOOM_KEY, zoom); renderSlide(); }

/* ---------- grados de la escala (igual que la app principal) ---------- */
var SCALE = [0,2,4,5,7,9,11];
var DEG_QUAL = ['', 'm', 'm', '', '', 'm', 'dim'];
var QUAL_IV = {'':[0,4,7,12], 'm':[0,3,7,12], 'dim':[0,3,6,12]};
var gradosRootSel = 'auto';
function renderGrados(){
  var songKey = queue.length ? KEYS[keyIndex(queue[cur].key)] : 'RE';
  var h = '<option value="auto"' + (gradosRootSel==='auto'?' selected':'') + '>Tono de la canción: ' + songKey + '</option>';
  for(var i=0;i<KEYS.length;i++){ h += '<option' + (gradosRootSel===KEYS[i]?' selected':'') + '>' + KEYS[i] + '</option>'; }
  $('gradosRoot').innerHTML = h;
  var root = keyIndex(gradosRootSel==='auto' ? songKey : gradosRootSel), r = '';
  for(var j=0;j<7;j++){
    var n = mod12(root + SCALE[j]), q = DEG_QUAL[j];
    r += '<div class="grado"><button data-note="' + n + '" data-q="' + q + '"><span class="gn">' + (j+1) + '</span>' +
         '<span class="gc">' + SHARP_NAMES[n] + (q==='m' ? 'm' : (q==='dim' ? '&deg;' : '')) + '</span></button></div>';
  }
  $('gradosRow').innerHTML = r;
}
var audioCtx = null;
function getAudio(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!audioCtx){ try{ audioCtx = new AC(); }catch(e){ return null; } }
  if(audioCtx.state === 'suspended' && audioCtx.resume){ try{ audioCtx.resume(); }catch(e){} }
  return audioCtx;
}
function pluck(freq, delay){
  var ctx = getAudio(); if(!ctx) return;
  var t0 = ctx.currentTime + delay, dur = 1.6;
  var osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'triangle'; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(0.5, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function playChord(noteIdx, q){
  var iv = QUAL_IV[q] || QUAL_IV[''];
  for(var i=0;i<iv.length;i++){
    var semis = 3*12 + noteIdx + iv[i];
    pluck(16.3516 * Math.pow(2, semis/12), i*0.04);
  }
}
$('gradosBtn').onclick = function(){
  var p = $('gradosPanel'), open = p.className !== 'open';
  p.className = open ? 'open' : '';
  this.className = open ? 'lb on' : 'lb';
  if(open) renderGrados();
};
$('gradosRoot').onchange = function(){ gradosRootSel = this.value; renderGrados(); this.blur(); };
$('gradosRow').onclick = function(e){
  var t = e.target; while(t && t !== this && t.tagName !== 'BUTTON') t = t.parentNode;
  if(!t || t === this) return;
  playChord(+t.getAttribute('data-note'), t.getAttribute('data-q'));
  t.className = 'playing';
  setTimeout(function(){ t.className = ''; }, 600);
};

/* ---------- eventos ---------- */
$('refreshBtn').onclick = refresh;
$('search').oninput = renderSongs;
$('search').onkeyup = renderSongs;
$('goLive').onclick = function(){ openLive(0); };
$('songs').onclick = function(e){
  var t = e.target; while(t && t !== this && !t.getAttribute('data-add')) t = t.parentNode;
  if(!t || t === this) return;
  var id = t.getAttribute('data-add'), pos = inQueue(id);
  if(pos === -1){ var s = findSong(id); queue.push({id:id, key:s.versions[0].key}); }
  else queue.splice(pos, 1);
  saveQueue(); renderSongs(); renderQueue();
};
$('lists').onclick = function(e){ var i = e.target.getAttribute('data-list'); if(i !== null) openList(+i); };
$('queue').onclick = function(e){
  var up = e.target.getAttribute('data-up'), down = e.target.getAttribute('data-down'), del = e.target.getAttribute('data-del');
  if(up !== null && +up > 0){ var a = queue.splice(+up, 1)[0]; queue.splice(+up-1, 0, a); }
  else if(down !== null && +down < queue.length-1){ var b = queue.splice(+down, 1)[0]; queue.splice(+down+1, 0, b); }
  else if(del !== null){ queue.splice(+del, 1); }
  else return;
  saveQueue(); renderSongs(); renderQueue();
};
$('queue').onchange = function(e){
  var i = e.target.getAttribute('data-qkey');
  if(i !== null){ queue[+i].key = e.target.value; saveQueue(); }
};
$('liveClose').onclick = closeLive;
$('prevBtn').onclick = function(){ go(-1); };
$('nextBtn').onclick = function(){ go(1); };
$('zoomIn').onclick = function(){ setZoom(zoom + 0.1); };
$('zoomOut').onclick = function(){ setZoom(zoom - 0.1); };
$('keyUp').onclick = function(){ shiftKey(1); };
$('keyDown').onclick = function(){ shiftKey(-1); };
$('keyReset').onclick = resetKey;
$('liveKey').onchange = function(){ queue[cur].key = this.value; saveQueue(); renderSlide(); };

/* pedal Bluetooth: mismas teclas que la app principal (usa keyCode para navegadores viejos) */
document.addEventListener('keydown', function(e){
  if(!isLive()) return;
  var k = e.key, c = e.keyCode || e.which;
  if(k==='ArrowRight' || k==='PageDown' || k===' ' || c===39 || c===34 || c===32){ go(1); }
  else if(k==='ArrowLeft' || k==='PageUp' || c===37 || c===33){ go(-1); }
  else if(k==='ArrowUp' || k==='+' || k==='=' || c===38 || c===107 || c===187){ shiftKey(1); }
  else if(k==='ArrowDown' || k==='-' || k==='_' || c===40 || c===109 || c===189){ shiftKey(-1); }
  else if(k==='0' || c===48 || c===96){ resetKey(); }
  else if(k==='Escape' || c===27){ closeLive(); }
  else return;
  e.preventDefault();
}, false);

/* deslizar con el dedo para pasar de canción */
(function(){
  var sx = 0, sy = 0, el = $('liveSlide');
  el.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, false);
  el.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  }, false);
})();

buildSongs();
renderAll();
showDataStatus();
if(navigator.onLine !== false) refresh();
</script>
